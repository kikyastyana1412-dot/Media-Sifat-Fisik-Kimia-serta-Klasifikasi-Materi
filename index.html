<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14232e">
<title>Kimia Itu Dekat! Sifat dan Klasifikasi Materi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14232e;--mut:#55697a;--paper:#f4f8fa;--grid:#dbe6ec;--line:#b9c9d4;--soft:#eaf1f5;
  --ok:#1d7a45;--okbg:#ddf4e5;--bad:#b3261e;--badbg:#fde7e5;--gold:#f2b705;
  --c-unsur:#0f9d8a;--c-senyawa:#4c5fd5;--c-homogen:#f2b705;--c-heterogen:#e8731a;--c-campuran:#f2b705;--c-fisik:#1f86cc;--c-kimia:#e5484d;
  --fh:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fb:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
[data-g=buka]{--tc:#5b7a99;--tt:#fff;--ac:#5b7a99}
[data-g=tes]{--tc:#f2b705;--tt:#14232e;--ac:#d9a400}
[data-g=m1]{--tc:#1f86cc;--tt:#fff;--ac:#1f86cc}
[data-g=m2]{--tc:#c2255c;--tt:#fff;--ac:#c2255c}
[data-g=tutup]{--tc:#23844f;--tt:#fff;--ac:#23844f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:17px/1.6 var(--fb);padding-bottom:84px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.01em;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nd:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- kepala dan deretan petak ---------- */
.top{background:var(--ink);color:#fff;padding:12px 14px 0}
.top .row{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font:800 18px/1 var(--fh);letter-spacing:-.01em}
.who{font-size:14px;color:#c4d3de;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav#tiles{position:sticky;top:0;z-index:20;background:var(--ink);display:flex;gap:6px;overflow-x:auto;padding:12px max(14px,calc((100% - 760px)/2)) 12px;scrollbar-width:none}
nav#tiles::-webkit-scrollbar{display:none}
.tile{position:relative;flex:0 0 auto;width:46px;height:52px;border:0;border-radius:6px;background:var(--tc);color:var(--tt);cursor:pointer;font-family:var(--fh);opacity:.74;transition:opacity .15s,transform .15s}
.tile:hover{opacity:.9}
.tile .n{position:absolute;top:4px;left:5px;font:700 9.5px/1 var(--fb)}
.tile .s{display:block;font-weight:800;font-size:20px;line-height:52px;text-align:center;letter-spacing:-.02em}
.tile .ck{position:absolute;top:3px;right:4px;font:700 10px/1 var(--fb);display:none}
.tile.done .ck{display:block}
.tile.on{opacity:1;transform:translateY(-3px);box-shadow:0 0 0 3px #fff}
.tile:disabled{opacity:.25;cursor:not-allowed}
.crumb{max-width:760px;margin:0 auto;padding:12px 14px 0;display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut)}
.crumb b{color:var(--ink);font-family:var(--fh);font-size:15px}

/* ---------- lembar ---------- */
main.sheet{max-width:760px;margin:10px auto 0;background:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:6px 6px 0 rgba(20,35,46,.16);padding:20px 18px 24px}
@media(max-width:800px){main.sheet{margin:10px 12px 0}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.0}to{opacity:1}}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.mk{flex:0 0 auto;width:46px;height:52px;border-radius:6px;background:var(--tc);color:var(--tt);font:800 20px/52px var(--fh);text-align:center;letter-spacing:-.02em}
h2{font-size:26px;line-height:1.15}
h3{font-size:18px;line-height:1.25;margin-bottom:6px}
.grp{margin:2px 0 0;font-size:14px;color:var(--mut)}
.lead{font-size:18px;color:#2d4556;margin:6px 0 14px;max-width:62ch}
p{margin:8px 0}
section.blk{margin:22px 0 0}
section.blk>h3{border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:10px}
ul.plain,ol.plain{padding-left:22px;margin:6px 0}
ul.plain li,ol.plain li{margin:4px 0}
.note{border-left:6px solid var(--ac,var(--tc));background:var(--soft);padding:10px 14px;margin:14px 0;border-radius:0 8px 8px 0}
.note.warn{border-left-color:var(--gold);background:#fff7d6}
.note p:first-child{margin-top:0}.note p:last-child{margin-bottom:0}
small,.sm{font-size:14px;color:var(--mut)}

/* ---------- beranda ---------- */
.hero{display:flex;gap:18px;align-items:center;margin:4px 0 6px}
.bigtile{position:relative;flex:0 0 auto;width:96px;height:108px;border-radius:10px;background:var(--ink);color:#fff;box-shadow:5px 5px 0 var(--gold)}
.bigtile .n{position:absolute;top:8px;left:10px;font:700 14px/1 var(--fb)}
.bigtile .s{position:absolute;left:0;right:0;top:26px;text-align:center;font:800 52px/1 var(--fh);letter-spacing:-.04em}
.bigtile .m{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:700 12px/1 var(--fb);color:#c4d3de}
h1{font-size:clamp(34px,9vw,52px);line-height:1;font-weight:800;letter-spacing:-.03em}
ul.goals{list-style:none;padding:0;margin:8px 0}
ul.goals li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid)}
ul.goals li i{width:28px;height:28px;border-radius:5px;background:var(--tc);color:var(--tt);font:800 13px/28px var(--fh);text-align:center;font-style:normal}
ol.path{list-style:none;margin:8px 0;padding:0;position:relative}
ol.path li{position:relative;display:grid;grid-template-columns:38px 1fr;gap:12px;padding:0 0 14px}
ol.path li::before{content:"";position:absolute;left:18px;top:34px;bottom:0;width:2px;background:var(--line)}
ol.path li:last-child::before{display:none}
ol.path li i{width:38px;height:38px;border-radius:6px;background:var(--tc);color:var(--tt);font:800 15px/38px var(--fh);text-align:center;font-style:normal}
ol.path b{font-family:var(--fh)}

/* ---------- form dan tombol ---------- */
label{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-block;background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px 18px;font:700 16px/1.2 var(--fh);cursor:pointer;margin:8px 8px 0 0;box-shadow:3px 3px 0 var(--ac,var(--tc,#5b7a99));transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ac,#5b7a99)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ac)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.warm{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.hidden{display:none!important}
.chip{border:2px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font:700 15px/1.2 var(--fb);cursor:pointer;margin:6px 6px 0 0;color:var(--ink)}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip.mini{font-size:13px;padding:6px 10px}
.chip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.sel.c-fisik{background:var(--c-fisik);border-color:var(--c-fisik)}
.chip.sel.c-kimia{background:var(--c-kimia);border-color:var(--c-kimia)}
.chip.sel.c-unsur{background:var(--c-unsur);border-color:var(--c-unsur)}
.chip.sel.c-senyawa{background:var(--c-senyawa);border-color:var(--c-senyawa)}
.chip.sel.c-campuran{background:var(--c-campuran);border-color:#c99700;color:var(--ink)}
.chip:disabled{cursor:default}
.reveal{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit}
.reveal:hover{border-color:var(--ink)}
.reveal .rt{font:700 16px var(--fh)}
.reveal .rb{display:none;margin-top:6px}
.reveal .hint{font-size:13px;color:var(--mut)}
.reveal.open{border-color:var(--ink);background:#fffbe8}
.reveal.open .rb{display:block}
.reveal.open .hint{display:none}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft);font-family:var(--fh)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.box{border:2px solid var(--ink);border-radius:8px;padding:10px 12px}
.box.f{background:#e3f2fc;border-color:var(--c-fisik)}
.box.k{background:#fde8e8;border-color:var(--c-kimia)}
.box b{font-family:var(--fh)}

/* ---------- pengamatan dan sorter ---------- */
.item{border:2px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;background:#fff}
.item.locked{background:#fafcfd}
.ihead{display:flex;gap:10px;align-items:flex-start}
.ihead p{margin:2px 0 0;color:var(--mut);font-size:15px}
.ico{font-size:28px;line-height:1.2}
.reason{margin-top:8px}
.fb{margin-top:10px;border-radius:8px;padding:10px 12px;font-size:15.5px}
.fb.ok{background:var(--okbg);color:#0c4a2c}
.fb.bad{background:var(--badbg);color:#7a1b12}
.score{font:800 46px/1 var(--fh);letter-spacing:-.03em}
.score small{font-size:20px;color:var(--mut);font-weight:700}
.status{font-size:14.5px;margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--soft)}
.status.ok{background:var(--okbg);color:#0c4a2c}
.status.warn{background:#fff1c9;color:#6b4300}
.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:8px 0}
.matchrow.ok select{border-color:var(--ok);background:var(--okbg)}
.matchrow.bad select{border-color:var(--bad);background:var(--badbg)}
.steps{counter-reset:s;padding:0;list-style:none;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:8px 8px 8px 44px;margin:6px 0;border:2px solid var(--line);border-radius:8px;background:#fff}
.steps li::before{content:counter(s);position:absolute;left:10px;top:8px;width:26px;height:26px;border-radius:5px;background:var(--ink);color:#fff;text-align:center;font:800 14px/26px var(--fh)}

/* ---------- diagram ---------- */
.dg{width:100%;max-width:520px;height:auto;display:block;margin:8px auto}
.dg text{font-family:var(--fb)}
.nd{cursor:default}
.nd[data-p]{cursor:pointer}
.nd rect{fill:#fff;stroke:var(--ink);stroke-width:2;transition:stroke-width .12s}
.nd .tm{font:800 12.5px var(--fh);text-anchor:middle;fill:var(--ink)}
.nd .ts{font-size:9.5px;text-anchor:middle;fill:#3f5565}
.nd.unsur .tm,.nd.senyawa .tm,.nd.homogen .tm,.nd.heterogen .tm{font-size:11px;letter-spacing:-.01em}
.nd.root rect,.nd.start rect{fill:var(--ink)}
.nd.root .tm,.nd.start .tm{fill:#fff}
.nd.tunggal rect{fill:#e6eef5;stroke:#51657a}
.nd.campuran rect{fill:#fff3cc;stroke:#b07d00}
.nd.unsur rect{fill:#c9efe9;stroke:var(--c-unsur)}
.nd.senyawa rect{fill:#dfe3ff;stroke:var(--c-senyawa)}
.nd.homogen rect{fill:#fff0a8;stroke:#c99700}
.nd.heterogen rect{fill:#ffd9bd;stroke:var(--c-heterogen)}
.nd.q rect{fill:#ffe58a}
.nd.fisik rect{fill:#d4ecfb;stroke:var(--c-fisik)}
.nd.kimia rect{fill:#ffd9d9;stroke:var(--c-kimia)}
.nd.sel rect{stroke-width:4.5}
.nd[data-p]:hover rect{stroke-width:4}
.nd.hl rect{stroke:#b07d00;stroke-width:4.5;fill:#fff0a8}
.nd.hl.root rect,.nd.hl.start rect{fill:var(--ink)}
.ed{fill:none;stroke:#3b5368;stroke-width:2.2;stroke-linejoin:round}
.ed.hl{stroke:#d98b00;stroke-width:3.6;stroke-dasharray:7 5;animation:fl .8s linear infinite}
@keyframes fl{to{stroke-dashoffset:-12}}
.lbp rect{fill:#fff;stroke:#9db2c1}
.lbp text{font-size:9.5px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.lbp.y rect{fill:#d9f5df;stroke:#2e9a4f}
.lbp.t rect{fill:#ffdcdc;stroke:var(--c-kimia)}
.tc{font-size:9.5px;text-anchor:middle;fill:var(--ink);font-weight:700}
.te{font-size:9.5px;text-anchor:middle;fill:#55697a;font-style:italic}
.dg.has-hl .nd:not(.hl),.dg.has-hl .ed:not(.hl),.dg.has-hl .lbp:not(.hl){opacity:.28}
.panelbox{border:2px solid var(--ink);border-radius:8px;padding:12px 14px;margin-top:8px;background:#fff}
.psvg{width:100%;max-width:340px;display:block;margin:8px auto}
.legend{font-size:13px;color:var(--mut);text-align:center}

/* ---------- soal format TKA ---------- */
.tka-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.timer{font:800 15px/1 var(--fh);background:var(--ink);color:#fff;padding:8px 12px;border-radius:6px}
.timer.low{background:var(--bad)}
.timer.soft{background:var(--soft);color:var(--ink)}
.cnt{font-size:14px;color:var(--mut)}
.navgrid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.nb{width:38px;height:38px;border-radius:6px;border:2px solid var(--line);background:#fff;font:800 14px var(--fh);cursor:pointer;color:var(--ink)}
.nb.ans{background:var(--ink);border-color:var(--ink);color:#fff}
.nb.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.nb.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.nb.cur{box-shadow:0 0 0 3px var(--gold)}
.qcard{border:2px solid var(--ink);border-radius:8px;padding:14px;margin:10px 0;background:#fff}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font:700 12.5px/1 var(--fb);padding:5px 9px;border-radius:5px;border:2px solid var(--ink)}
.tag.num{background:var(--ink);color:#fff}
.tag.lvl{border-color:var(--line);color:var(--mut)}
.stim{background:#f3f8fa;border-left:6px solid var(--ac,#5b7a99);padding:10px 14px;margin:10px 0;border-radius:0 8px 8px 0;font-size:16px}
.qtext{font-size:18px;margin:8px 0 2px;font-weight:700}
.qins{font-size:14px;color:var(--mut);margin:0 0 8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .let{flex:0 0 26px;height:26px;border-radius:5px;border:2px solid var(--line);font:800 13px/22px var(--fh);text-align:center}
.opt.chk .let{border-radius:4px}
.opt.sel{border-color:var(--ink);background:#eef4f8}
.opt.sel .let{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .let{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .mk2{margin-left:auto;font-weight:800}
.opt:disabled{cursor:default}
table.bs td:nth-child(n+2),table.bs th:nth-child(n+2){text-align:center;width:76px;padding:6px}
.tog{width:100%;border:2px solid var(--line);background:#fff;border-radius:6px;padding:6px 0;font:700 13px var(--fb);cursor:pointer;color:var(--ink)}
.tog.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tog.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tog.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.tog:disabled{cursor:default}
.kinds{list-style:none;padding:0;margin:8px 0}
.kinds li{padding:8px 0 8px 14px;border-left:6px solid var(--gold);margin:8px 0;background:#fffbe8}
.bar{height:12px;background:var(--soft);border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--ink)}
.cmp{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.cmp div{flex:1 1 120px;border:2px solid var(--ink);border-radius:8px;padding:8px 10px}
.cmp b{display:block;font:800 26px/1.1 var(--fh)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0}
.badge{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;font-size:14px;line-height:1.25}
.badge i{width:44px;height:48px;border-radius:6px;border:2px dashed var(--line);color:var(--mut);font:800 18px/44px var(--fh);text-align:center;font-style:normal}
.badge.got i{border:0;background:var(--tc);color:var(--tt);line-height:48px}

/* ---------- bawah dan lainnya ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--ink);padding:10px 14px;z-index:30}
.bottom .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.bottom .btn{margin:0;padding:10px 12px;font-size:15px}
.bottom .mid{font:700 14px var(--fh);color:var(--mut)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:50;font-size:14.5px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
footer.cr{max-width:760px;margin:10px auto 0;padding:0 14px;font-size:13px;color:var(--mut);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;animation:drop 2.4s ease-in forwards}
@keyframes drop{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media(max-width:560px){
  table.bs,table.bs tbody{display:block}
  table.bs tr:first-child{display:none}
  table.bs tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:2px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
  table.bs td{border:0;padding:0}
  table.bs td:first-child{grid-column:1/-1;padding-bottom:4px}
  table.bs td:nth-child(n+2){width:auto;padding:0}
}
@media(max-width:560px){.two,.grid2,.matchrow{grid-template-columns:1fr}.who{max-width:50%}.hero{gap:14px}.bigtile{width:80px;height:92px}.bigtile .s{font-size:42px;top:22px}h2{font-size:23px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <marker id="arT" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5368"/></marker>
  <marker id="arH" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d98b00"/></marker>
</defs></svg>
<header class="top"><div class="row"><div class="brand">Kimia itu dekat</div><div class="who" id="who"></div></div></header>
<nav id="tiles" aria-label="Daftar tab"></nav>
<div class="crumb"><span id="crumb"></span><span id="proglabel"></span></div>
<main class="sheet" id="view"></main>
<footer class="cr" id="credit"></footer>
<div class="bottom"><div class="in">
  <button class="btn alt" id="prev">Tab sebelumnya</button>
  <div class="mid" id="where"></div>
  <button class="btn" id="next">Tab berikutnya</button>
</div></div>
<div id="toast" role="status"></div>
<noscript><p style="padding:16px">Media ini membutuhkan JavaScript. Aktifkan JavaScript di peramban kamu.</p></noscript>

<script>
/* ================= PENGATURAN GURU (ubah di sini) ================= */
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycby0JfvuCCxQ5orNOCThL3skIR7EyjU_Uk71b68dvzJpARFY1nFoGoob9J-ef9cBR7e6_w/exec", // URL /exec dari Apps Script

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {

let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function confetti(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div"); box.className = "confetti";
  const cols = ["#0f9d8a", "#4c5fd5", "#f2b705", "#e8731a", "#1f86cc", "#c2255c"];
  for(let k = 0; k < 44; k++){
    const s = document.createElement("i");
    s.style.left = Math.random() * 100 + "%"; s.style.background = cols[k % cols.length];
    s.style.animationDelay = (Math.random() * 0.6) + "s"; s.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
    s.style.transform = "rotate(" + Math.round(Math.random() * 360) + "deg)";
    box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3800);
}

/* ---------- Pengiriman ke Apps Script ---------- */
const urlReady = () => CONFIG.APPS_SCRIPT_URL && !/^ISI_/.test(CONFIG.APPS_SCRIPT_URL);
async function sendRec(rec){
  if(!urlReady()) return "lokal";
  const opt = { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(rec) };
  try{
    const r = await fetch(CONFIG.APPS_SCRIPT_URL, opt);
    const j = await r.json();
    if(j && j.ok) return "terkirim";
    throw new Error("respons");
  }catch(e){
    try{ await fetch(CONFIG.APPS_SCRIPT_URL, Object.assign({ mode: "no-cors" }, opt)); return "terkirim"; }
    catch(e2){ return "antri"; }
  }
}
async function flushQueue(){
  if(!QUEUE.length || !urlReady()) return;
  const rest = [];
  for(const rec of QUEUE){ const st = await sendRec(rec); if(st === "antri") rest.push(rec); }
  QUEUE = rest; store.set("queue", QUEUE);
}
const KEEP_DETAIL = ["apersepsi", "asesmen_awal", "asesmen_akhir"];
async function kirim(kegiatan, skor, maks, detail){
  const rec = { id: uid(), token: CONFIG.TOKEN, waktu: new Date().toISOString(), nama: S.user.nama, kelas: S.user.kelas, absen: S.user.absen, kegiatan, skor, maks, detail };
  const nv = { skor, maks, waktu: rec.waktu, detail: KEEP_DETAIL.indexOf(kegiatan) >= 0 ? detail : undefined };
  const old = S.data[kegiatan];
  const keepFirst = kegiatan === "asesmen_awal";
  if(!old) S.data[kegiatan] = nv;
  else if(!keepFirst && (maks === null || old.maks === null || old.maks === undefined || skor / maks > old.skor / old.maks)) S.data[kegiatan] = nv;
  S.done[kegiatan] = true; persist(); renderChrome();
  const st = await sendRec(rec);
  if(st === "antri"){ QUEUE.push(rec); store.set("queue", QUEUE); }
  return st;
}
function statusHTML(st){
  if(st === "terkirim") return '<div class="status ok">Jawabanmu sudah terkirim ke gurumu.</div>';
  if(st === "antri") return '<div class="status warn">Jaringan bermasalah, jawabanmu belum terkirim. Jawaban tersimpan di perangkat ini dan akan dicoba lagi otomatis. Buka kembali tautan ini saat sinyal bagus dan jangan hapus data peramban.</div>';
  return '<div class="status">Mode uji coba: URL Apps Script belum diisi, hasil hanya tersimpan di perangkat ini.</div>';
}

/* ---------- Mesin soal berformat TKA ---------- */
const LETK = i => String.fromCharCode(65 + i);
const KIND = { pg: "Pilihan ganda", pgk: "Pilihan ganda kompleks", bs: "Benar / salah" };
const INS = {
  pg: "Pilih <b>satu</b> jawaban yang paling tepat.",
  pgk: "Pilih <b>semua</b> jawaban yang benar. Jawabannya lebih dari satu.",
  bs: "Tentukan setiap pernyataan <b>Benar</b> atau <b>Salah</b>."
};
function okItem(it, a){
  if(it.t === "pg") return a === it.a;
  if(it.t === "pgk") return Array.isArray(a) && a.length === it.a.length && a.slice().sort().join() === it.a.slice().sort().join();
  return Array.isArray(a) && a.length === it.s.length && it.s.every((s, r) => a[r] === s.a);
}
function isAns(it, a){
  if(it.t === "pg") return a !== null && a !== undefined;
  if(it.t === "pgk") return Array.isArray(a) && a.length > 0;
  return Array.isArray(a) && a.length === it.s.length && a.every(x => x === true || x === false);
}
function perInd(items, ans){
  const r = {};
  ["A", "B"].forEach(k => {
    const ix = []; items.forEach((it, n) => { if(it.ind === k) ix.push(n); });
    r[k] = ix.length ? Math.round(ix.filter(n => okItem(items[n], ans[n])).length / ix.length * 100) : null;
  });
  return r;
}
function itemHTML(it, idx, a, show){
  const good = show ? okItem(it, a) : false;
  let h = `<div class="qmeta"><span class="tag num">Soal ${idx + 1}</span><span class="tag">${KIND[it.t]}</span>${it.lvl ? `<span class="tag lvl">${it.lvl}</span>` : ""}</div>`;
  if(it.stim) h += `<div class="stim">${it.stim}</div>`;
  h += `<p class="qtext">${it.q}</p><p class="qins">${INS[it.t]}</p>`;
  if(it.t === "pg" || it.t === "pgk"){
    h += `<div class="opts">` + it.o.map((o, k) => {
      const sel = it.t === "pg" ? a === k : (Array.isArray(a) && a.indexOf(k) >= 0);
      const key = it.t === "pg" ? it.a === k : it.a.indexOf(k) >= 0;
      let cls = "opt " + (it.t === "pgk" ? "chk " : "") + (sel ? "sel " : "");
      if(show){ if(key) cls += "ok "; else if(sel) cls += "bad "; }
      const lt = it.t === "pgk" ? (sel || (show && key) ? "✓" : "") : LETK(k);
      const mk = show ? (key ? '<span class="mk2">Benar</span>' : (sel ? '<span class="mk2">Salah</span>' : "")) : "";
      return `<button type="button" class="${cls}" data-k="${k}"${show ? " disabled" : ""}><span class="let">${lt}</span><span>${o}</span>${mk}</button>`;
    }).join("") + `</div>`;
  }else{
    h += `<table class="bs"><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>` + it.s.map((s, r) => {
      const v = Array.isArray(a) ? a[r] : null;
      const cell = val => {
        let c = "tog " + (v === val ? "on " : "");
        if(show){ if(s.a === val) c += "ok "; else if(v === val) c += "bad "; }
        return `<button type="button" class="${c}" data-r="${r}" data-v="${val ? 1 : 0}"${show ? " disabled" : ""}>${val ? "Benar" : "Salah"}</button>`;
      };
      return `<tr><td>${s.t}</td><td>${cell(true)}</td><td>${cell(false)}</td></tr>`;
    }).join("") + `</table>`;
  }
  if(show) h += `<div class="fb ${good ? "ok" : "bad"}"><b>${good ? "Tepat." : "Belum tepat."}</b> ${it.e}</div>`;
  return h;
}

function initTKA(cfg){
  const id = cfg.id, items = cfg.items, mode = cfg.mode, N = items.length, test = mode !== "latihan";
  const box = $("#tka");
  const dr = test ? (store.get("draft", {})[id] || {}) : {};
  let ans = (Array.isArray(dr.ans) && dr.ans.length === N) ? dr.ans : new Array(N).fill(null);
  let qi = Math.min(Math.max(dr.i || 0, 0), N - 1);
  let t0 = dr.t0 || null;
  let checked = new Array(N).fill(false);
  let timer = null;
  CLEAN = () => { if(timer) clearInterval(timer); };
  const save = () => { if(!test) return; const D = store.get("draft", {}); D[id] = { ans, i: qi, t0 }; store.set("draft", D); };
  const clearDraft = () => { const D = store.get("draft", {}); delete D[id]; store.set("draft", D); };
  const score = a => items.reduce((s, it, k) => s + (okItem(it, a[k]) ? 1 : 0), 0);

  function tick(){
    const el = $("#tm"); if(!el || !t0) return;
    const rem = CONFIG.MENIT_ASESMEN * 60 - Math.floor((Date.now() - t0) / 1000);
    const a = Math.abs(rem);
    el.textContent = rem >= 0 ? "Sisa waktu " + pad(Math.floor(a / 60)) + ":" + pad(a % 60) : "Waktu habis, segera kirim";
    el.classList.toggle("low", rem <= 60);
  }
  function intro(){
    box.innerHTML = `<div class="note"><p>${cfg.intro}</p></div>
      <h3>Bentuk soal yang akan kamu temui</h3>
      <ul class="kinds"><li><b>Pilihan ganda.</b> Pilih satu jawaban yang paling tepat.</li>
      <li><b>Pilihan ganda kompleks.</b> Pilih semua jawaban yang benar. Jawabannya lebih dari satu.</li>
      <li><b>Benar / salah.</b> Tentukan setiap pernyataan benar atau salah.</li></ul>
      <p>Sebagian soal punya bacaan atau data di atasnya. Baca bagian itu lebih dulu, lalu cari kata kunci pada pertanyaan.</p>
      <p><b>${N} soal, ${CONFIG.MENIT_ASESMEN} menit.</b> Soal pilihan ganda kompleks dan benar/salah dinilai benar jika semua pilihanmu tepat. Soal bisa dijawab tidak berurutan, dan jawabanmu tersimpan otomatis.</p>
      <button type="button" class="btn" id="go1">Mulai mengerjakan</button>`;
    $("#go1").onclick = () => { t0 = Date.now(); save(); draw(); };
  }
  function stClass(k){
    if(!test && checked[k]) return okItem(items[k], ans[k]) ? "ok" : "bad";
    return isAns(items[k], ans[k]) ? "ans" : "";
  }
  function draw(){
    const it = items[qi];
    const nAns = items.filter((x, k) => isAns(x, ans[k])).length;
    const show = !test && checked[qi];
    let h = `<div class="tka-top">${test ? '<span class="timer" id="tm">Sisa waktu --:--</span>' : '<span class="timer soft">Latihan dengan umpan balik langsung</span>'}<span class="cnt">Terjawab <b>${nAns}</b> dari ${N}</span></div>
      <div class="navgrid">${items.map((_, k) => `<button type="button" class="nb ${k === qi ? "cur " : ""}${stClass(k)}" data-k="${k}" aria-label="Soal ${k + 1}">${k + 1}</button>`).join("")}</div>
      <div class="qcard">${itemHTML(it, qi, ans[qi], show)}</div><div>`;
    if(test){
      h += `<button type="button" class="btn alt" id="pv"${qi === 0 ? " disabled" : ""}>Soal sebelumnya</button>`;
      h += qi < N - 1 ? `<button type="button" class="btn" id="nx">Soal berikutnya</button>` : "";
      h += `<button type="button" class="btn warm" id="fin">Selesai dan kirim</button></div><div id="fwarn"></div>`;
    }else{
      if(!show) h += `<button type="button" class="btn" id="chkq"${isAns(it, ans[qi]) ? "" : " disabled"}>Periksa jawaban</button>`;
      else h += qi < N - 1 ? `<button type="button" class="btn" id="nx">Soal berikutnya</button>` : `<button type="button" class="btn warm" id="fin">Lihat hasil</button>`;
      h += `</div>`;
    }
    box.innerHTML = h;
    box.querySelectorAll(".nb").forEach(b => b.onclick = () => { qi = +b.dataset.k; save(); draw(); });
    if(!show){
      box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        const k = +b.dataset.k;
        if(it.t === "pg") ans[qi] = k;
        else { const cur = Array.isArray(ans[qi]) ? ans[qi].slice() : []; const p = cur.indexOf(k); if(p >= 0) cur.splice(p, 1); else cur.push(k); cur.sort(); ans[qi] = cur; }
        save(); draw();
      });
      box.querySelectorAll(".tog").forEach(b => b.onclick = () => {
        const arr = Array.isArray(ans[qi]) ? ans[qi].slice() : it.s.map(() => null);
        arr[+b.dataset.r] = b.dataset.v === "1"; ans[qi] = arr; save(); draw();
      });
    }
    const nx = $("#nx", box); if(nx) nx.onclick = () => { qi = Math.min(N - 1, qi + 1); save(); draw(); };
    const pv = $("#pv", box); if(pv) pv.onclick = () => { qi = Math.max(0, qi - 1); save(); draw(); };
    const cq = $("#chkq", box); if(cq) cq.onclick = () => { checked[qi] = true; draw(); };
    const fin = $("#fin", box);
    if(fin) fin.onclick = () => {
      if(test){
        const un = N - nAns;
        if(un > 0){
          $("#fwarn").innerHTML = `<div class="status warn">Masih ada <b>${un}</b> soal yang belum dijawab. Kirim sekarang?<br><button type="button" class="btn warm" id="fy">Ya, kirim</button><button type="button" class="btn alt" id="fn">Periksa lagi</button></div>`;
          $("#fy").onclick = submit; $("#fn").onclick = () => { $("#fwarn").innerHTML = ""; };
        }else submit();
      }else{
        const first = checked.indexOf(false);
        if(first >= 0){ toast("Masih ada soal yang belum diperiksa"); qi = first; draw(); }
        else submit();
      }
    };
    if(test){ if(!timer) timer = setInterval(tick, 1000); tick(); }
  }
  async function submit(){
    if(timer){ clearInterval(timer); timer = null; }
    const sc = score(ans), per = perInd(items, ans);
    const detail = { ans, per, detik: t0 ? Math.round((Date.now() - t0) / 1000) : null };
    if(test) clearDraft();
    showResult(ans, false);
    const st = await kirim(id, sc, N, detail);
    const el = $("#st"); if(el) el.innerHTML = statusHTML(st);
  }
  function reviewHTML(a){ return items.map((it, k) => `<div class="qcard">${itemHTML(it, k, a[k], true)}</div>`).join(""); }
  function showResult(a, locked){
    const sc = score(a), p = pct(sc, N), per = perInd(items, a);
    const stBox = locked ? "" : `<div id="st"><div class="status">Mengirim hasil...</div></div>`;
    let h = "";
    if(mode === "pre"){
      h = `<div class="note"><h3>${locked ? "Kamu sudah mengerjakan asesmen awal" : "Asesmen awal sudah tercatat"}</h3>
        <p>Terima kasih sudah menjawab dengan jujur. Jawabannya belum dibahas, karena di akhir kamu akan mengerjakan asesmen serupa untuk melihat seberapa jauh kemajuanmu.</p></div>${stBox}
        <button type="button" class="btn" id="go">Lanjut belajar</button>`;
    }else if(mode === "post"){
      const pre = S.data.asesmen_awal, preP = pre && pre.maks ? pct(pre.skor, pre.maks) : null;
      const ng = preP !== null && preP < 100 ? (p - preP) / (100 - preP) : null;
      const kat = ng === null ? "" : (ng >= 0.7 ? "tinggi" : ng >= 0.3 ? "sedang" : "rendah");
      const msg = p >= 85 ? "Hebat, pemahamanmu sudah kuat." : p >= 60 ? "Bagus. Baca pembahasan untuk bagian yang masih keliru." : "Belum maksimal. Baca pembahasan, lalu ulangi bagian materi yang masih sulit.";
      h = `<div class="note"><div class="score">${p}<small> dari 100</small></div><p>${sc} dari ${N} soal benar. ${msg}</p></div>
        ${preP !== null ? `<div class="cmp"><div><small>Asesmen awal</small><b>${preP}%</b></div><div><small>Asesmen akhir</small><b>${p}%</b></div><div><small>Perubahan</small><b>${p - preP >= 0 ? "+" : ""}${p - preP} poin</b></div></div>
        ${kat ? `<p class="sm">Peningkatan belajarmu termasuk kategori <b>${kat}</b> (N-gain ${ng.toFixed(2)}).</p>` : ""}` : ""}
        <h3>Capaian tiap sub tujuan</h3>
        <p class="sm">Sub TP 1: membedakan sifat fisik dan sifat kimia, ${per.A}%</p><div class="bar"><i style="width:${per.A}%"></i></div>
        <p class="sm">Sub TP 2: mengklasifikasikan unsur, senyawa, dan campuran, ${per.B}%</p><div class="bar"><i style="width:${per.B}%"></i></div>
        ${stBox}
        <button type="button" class="btn alt" id="rv">Lihat pembahasan</button><button type="button" class="btn" id="go">Lanjut</button>
        <div id="review" class="hidden"><h3 style="margin-top:16px">Pembahasan</h3>${reviewHTML(a)}</div>`;
      if(!locked && p >= 60) confetti();
    }else{
      const salah = items.map((it, k) => okItem(it, a[k]) ? null : k + 1).filter(Boolean);
      const msg = p >= 85 ? "Luar biasa. Pemahamanmu sudah kuat." : p >= 60 ? "Bagus. Tinjau lagi soal yang masih keliru." : "Tidak apa-apa. Baca ulang materinya, lalu coba lagi.";
      h = `<div class="note"><div class="score">${sc}<small> dari ${N} (${p}%)</small></div><p>${msg}</p>${salah.length ? `<p>Soal yang perlu kamu tinjau: nomor <b>${salah.join(", ")}</b>.</p>` : ""}</div>${stBox}
        <button type="button" class="btn alt" id="again">Ulangi latihan</button><button type="button" class="btn" id="go">Lanjut</button>`;
      if(!locked && p >= 85) confetti();
    }
    box.innerHTML = h;
    $("#go").onclick = () => go(cur + 1);
    const rv = $("#rv"); if(rv) rv.onclick = () => { $("#review").classList.toggle("hidden"); rv.textContent = $("#review").classList.contains("hidden") ? "Lihat pembahasan" : "Sembunyikan pembahasan"; };
    const ag = $("#again"); if(ag) ag.onclick = () => { ans = new Array(N).fill(null); checked = new Array(N).fill(false); qi = 0; draw(); };
    box.scrollIntoView && box.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  const prev = S.data[id];
  if(test && prev && prev.detail && prev.detail.ans && !CONFIG.IZIN_ULANG_ASESMEN){ showResult(prev.detail.ans, true); return; }
  if(test && !t0){ intro(); return; }
  draw();
}

/* ---------- Sorter (Lab Virtual dan Misi Klasifikasi) ---------- */
const EVID = ["Muncul gelembung atau gas", "Terbentuk endapan", "Warna berubah", "Suhu berubah (panas atau dingin)", "Ada nyala atau cahaya"];
function sorterHTML(items, choices, opt){
  return `<div id="sorter">` + items.map((it, i) => `<div class="item" data-i="${i}">
    <div class="ihead"><span class="ico">${it.ico}</span><div><b>${it.t}</b>${it.d ? `<p>${it.d}</p>` : ""}</div></div>
    <div class="choices">${choices.map((c, k) => `<button type="button" class="chip c-${opt.col[k]}" data-k="${k}">${c}</button>`).join("")}</div>
    ${opt.evid ? `<div class="evid hidden"><small>Ciri apa yang kamu amati? (boleh lebih dari satu)</small><br>${EVID.map((x, k) => `<button type="button" class="chip mini" data-ev="${k}">${x}</button>`).join("")}</div>` : ""}
    ${opt.reason ? `<input class="reason" type="text" maxlength="200" placeholder="Alasanku memilih ini...">` : ""}
    <div class="fb hidden"></div></div>`).join("") +
    `<div><button type="button" class="btn" id="chk">Periksa jawabanku</button></div><div id="res"></div></div>`;
}
function initSorter(id, items, choices, opt){
  const root = $("#sorter");
  root.querySelectorAll(".item").forEach(card => {
    card.querySelectorAll(".choices .chip").forEach(b => b.onclick = () => {
      if(card.classList.contains("locked")) return;
      card.querySelectorAll(".choices .chip").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel"); card.dataset.sel = b.dataset.k;
      if(opt.evid) card.querySelector(".evid").classList.toggle("hidden", +b.dataset.k !== 1);
    });
    card.querySelectorAll("[data-ev]").forEach(b => b.onclick = () => { if(!card.classList.contains("locked")) b.classList.toggle("sel"); });
  });
  $("#chk").onclick = async () => {
    const cards = [...root.querySelectorAll(".item")];
    const miss = cards.filter(c => c.dataset.sel === undefined);
    if(miss.length){ toast("Masih ada " + miss.length + " item yang belum dijawab"); miss[0].scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    $("#chk").disabled = true;
    let sc = 0; const detail = [];
    cards.forEach((card, i) => {
      const it = items[i], sel = +card.dataset.sel, ok = sel === it.a; if(ok) sc++;
      card.classList.add("locked");
      card.querySelectorAll(".chip").forEach(c => c.disabled = true);
      const evSel = [...card.querySelectorAll("[data-ev].sel")].map(b => EVID[+b.dataset.ev]);
      const reason = card.querySelector(".reason") ? card.querySelector(".reason").value.trim() : "";
      let extra = "";
      if(opt.evid && it.a === 1 && it.ev) extra = `<br><small>Ciri yang bisa diamati: ${it.ev.map(k => EVID[k]).join(", ")}.</small>`;
      const fb = card.querySelector(".fb"); fb.classList.remove("hidden"); fb.classList.add(ok ? "ok" : "bad");
      fb.innerHTML = `<b>${ok ? "Tepat." : "Jawaban yang tepat: " + choices[it.a] + "."}</b> ${it.e}${extra}`;
      detail.push({ item: it.t.replace(/<[^>]+>/g, ""), pilih: choices[sel], benar: ok, ciri: evSel, alasan: reason });
    });
    const p = pct(sc, items.length);

    $("#res").scrollIntoView({ behavior: "smooth", block: "center" });
    if(p >= 85) confetti();

}

function nd(id, x, y, w, h, cls, main, sub, p){
  main = main || []; sub = sub || [];
  const LM = 15, LS = 12, total = main.length * LM + sub.length * LS;
  let cy = y + (h - total) / 2, out = "";
  main.forEach(t => { out += `<text class="tm" x="${x + w / 2}" y="${cy + LM - 3.5}">${t}</text>`; cy += LM; });
  sub.forEach(t => { out += `<text class="ts" x="${x + w / 2}" y="${cy + LS - 3}">${t}</text>`; cy += LS; });
  return `<g class="nd ${cls}" id="${id}"${p ? ` data-p="${p}" role="button" tabindex="0" aria-label="${main.join(" ")}"` : ""}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/>${out}</g>`;
}
const ed = (id, d) => `<path class="ed" id="${id}" d="${d}" marker-end="url(#arT)"/>`;
function lbp(id, x, y, t, k){
  const w = Math.round(t.length * 5.6 + 12);
  return `<g class="lbp ${k}" id="${id}"><rect x="${x - w / 2}" y="${y - 8}" width="${w}" height="16" rx="8"/><text x="${x}" y="${y + 3.6}">${t}</text></g>`;
}

function particleSVG(kind){
  const W = 280, H = 130, T = "#0f9d8a", A = "#f2b705", V = "#4c5fd5";
  const c = (x, y, r, f) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
  let g = "";
  if(kind === "unsur"){
    for(let r = 0; r < 3; r++) for(let k = 0; k < 7; k++) g += c(30 + k * 36 + (r % 2) * 10, 28 + r * 36, 12, T);
  }else if(kind === "senyawa"){
    for(let r = 0; r < 2; r++) for(let k = 0; k < 4; k++){
      const x = 44 + k * 64, y = 36 + r * 56;
      g += `<line x1="${x}" y1="${y}" x2="${x - 14}" y2="${y + 12}" stroke="#667" stroke-width="3"/><line x1="${x}" y1="${y}" x2="${x + 14}" y2="${y + 12}" stroke="#667" stroke-width="3"/>` + c(x, y, 12, V) + c(x - 14, y + 12, 8, T) + c(x + 14, y + 12, 8, T);
    }
  }else if(kind === "homogen"){
    for(let r = 0; r < 3; r++) for(let k = 0; k < 7; k++) g += c(30 + k * 36 + (r % 2) * 10, 28 + r * 36, 11, ((r * 7 + k) * 5) % 3 === 0 ? A : T);
  }else{
    for(let r = 0; r < 3; r++) for(let k = 0; k < 7; k++) g += c(30 + k * 36 + (r % 2) * 10, 28 + r * 36, 11, (k < 3 || (k === 3 && r === 1)) ? T : A);
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="psvg" role="img" aria-label="Model partikel ${kind}"><rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="10" fill="#fff" stroke="#b9c9d4"/>${g}</svg>`;
}

{ id: "peta", sym: "Pt", label: "Peta materi", g: "m2", kind: "content",

    `${treeSVG()}<div id="panel"></div>
    <section class="blk"><h3>Alur menentukan golongan suatu materi</h3>
      <p>Jawab pertanyaan dari atas dan ikuti panah <b>Ya</b> atau <b>Tidak</b> sampai ke golongan akhir. Pilih sebuah benda untuk melihat jalurnya menyala.</p>

    };
    root.querySelectorAll(".nd[data-p]").forEach(b => {
      b.onclick = () => show(b.dataset.p);
      b.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); show(b.dataset.p); } };

      <tr><td>Latihan TKA 1</td><td>${show("kuis1")}</td></tr><tr><td>Misi klasifikasi</td><td>${show("sortir")}</td></tr>
      <tr><td>Latihan TKA 2</td><td>${show("kuis2")}</td></tr><tr><td>Asesmen akhir</td><td>${show("asesmen_akhir")}</td></tr></table>
      <div class="badges">${bg.map(b => `<div class="badge ${b[2] ? "got" : ""}" data-g="${b[3]}"><i>${b[0]}</i><span>${b[1]}</span></div>`).join("")}</div></section>
    ${ap ? `<section class="blk"><h3>Kembali ke tebakan awalmu</h3><table><tr><th>Kejadian</th><th>Tebakanku</th><th>Sebenarnya</th></tr>${ap.map((x, i) => `<tr><td>${APERS[i].t}</td><td>${x.tebak === 2 ? "Belum tahu" : x.tebak === 0 ? "Zat baru" : "Zat sama"}</td><td>${APERS[i].a === 0 ? "Zat baru (kimia)" : "Zat sama (fisik)"}</td></tr>`).join("")}</table></section>` : ""}
    <section class="blk"><h3>Refleksiku</h3>
      <label for="s1">Aku merasa bisa membedakan sifat fisik dan sifat kimia suatu materi</label><select id="s1">${rate}</select>
      <label for="s2">Aku merasa bisa mengklasifikasikan materi menjadi unsur, senyawa, atau campuran</label><select id="s2">${rate}</select>
      <label for="r1">3 hal baru yang kupelajari</label><textarea id="r1" maxlength="800"></textarea>
      <label for="r2">2 hal yang masih membuatku bingung</label><textarea id="r2" maxlength="800"></textarea>
      <label for="r3">1 hal yang ingin kucoba atau kuamati di rumah</label><textarea id="r3" maxlength="800"></textarea>
      <button type="button" class="btn" id="kr">Kirim refleksi</button><div id="st"></div></section>`;
  },
  init(){
    $("#kr").onclick = async () => {
      const s1 = $("#s1").value, s2 = $("#s2").value, r1 = $("#r1").value.trim(), r2 = $("#r2").value.trim(), r3 = $("#r3").value.trim();
      if(!s1 || !s2 || r1.length < 5){ toast("Isi kedua penilaian diri dan minimal refleksi nomor 1"); return; }
      $("#kr").disabled = true;
      const st = await kirim("refleksi", null, null, { paham_sifat: +s1, paham_klasifikasi: +s2, hal_baru: r1, masih_bingung: r2, ingin_coba: r3 });
      $("#st").innerHTML = statusHTML(st) + `<div class="note"><h3>Terima kasih, ${esc(S.user.nama)}.</h3><p>Kamu sudah menyelesaikan seluruh media. Teruslah penasaran dengan kimia di sekitarmu.</p>${CONFIG.LINK_CLASSROOM ? `<a class="btn" href="${esc(CONFIG.LINK_CLASSROOM)}" target="_blank" rel="noopener">Buka Google Classroom</a>` : ""}</div>`;
      confetti();
    };
  } }
];

/* ================= NAVIGASI ================= */
let cur = 0;
function renderChrome(){
  $("#who").textContent = S.user ? S.user.nama + ", " + S.user.kelas : "";
  const nav = $("#tiles");
  nav.innerHTML = TABS.map((t, i) => `<button type="button" class="tile${i === cur ? " on" : ""}${S.done[t.id] ? " done" : ""}" data-g="${t.g}" data-i="${i}" title="${t.label}" aria-label="${i + 1}. ${t.label}"${i === cur ? ' aria-current="page"' : ""}${i > 0 && !S.user ? " disabled" : ""}><span class="n">${i + 1}</span><span class="s">${t.sym}</span><span class="ck">✓</span></button>`).join("");
  nav.querySelectorAll(".tile").forEach(b => b.onclick = () => go(+b.dataset.i));
  const a = nav.querySelector(".on"); if(a) nav.scrollLeft = a.offsetLeft - nav.clientWidth / 2 + a.offsetWidth / 2;
  const n = TABS.filter(t => S.done[t.id]).length;
  $("#crumb").innerHTML = `<b>${cur + 1}. ${TABS[cur].label}</b>`;
  $("#proglabel").textContent = n + " dari " + TABS.length + " selesai";
  $("#where").textContent = (cur + 1) + " / " + TABS.length;
  $("#prev").disabled = cur === 0; $("#next").disabled = cur === TABS.length - 1;
}
function render(){
  if(CLEAN){ CLEAN(); CLEAN = null; }
  const t = TABS[cur];
  if(t.kind === "content" && S.user){ S.done[t.id] = true; persist(); }
  const v = $("#view"); v.dataset.g = t.g;
  v.innerHTML = `<div class="fade">${t.render()}</div>`;
  if(t.init) t.init(v);
  renderChrome();
}
function go(i){
  if(i > 0 && !S.user){ toast("Isi identitasmu dulu di tab Mulai ya"); i = 0; }
  cur = Math.max(0, Math.min(TABS.length - 1, i));
  render(); window.scrollTo({ top: 0, behavior: "smooth" });
}
$("#prev").onclick = () => go(cur - 1);
$("#next").onclick = () => go(cur + 1);
$("#credit").textContent = [CONFIG.GURU, CONFIG.SEKOLAH].filter(Boolean).join(", ");
render(); flushQueue();
</script>
</body>
</html>
